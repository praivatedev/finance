{% extends "layout.html" %}

{% block title %}
Register
{% endblock %}
{% block main %}
<div>
    <h1>Register</h1>
    <form id="form-register">
        <div class="mb-3">
            <input autocomplete="off" autofocus class="form-control mx-auto w-auto" name="username"
                placeholder="username" type="text">
        </div>
        <div class="mb-3">
            <input class="form-control mx-auto w-auto" name="password" placeholder="Password" type="password">
        </div>
        <div class="mb-3">
            <input class="form-control mx-auto w-auto" name="confirmation" placeholder="Confirm Password" type="password">
        </div>
        <button class="btn btn-primary" type="submit">Register</button>
    </form>
    <p id="message" class="text-center mt-3"></p>
</div>

{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='register.js') }}"></script>
{% endblock %}
