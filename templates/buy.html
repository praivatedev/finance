{% extends "layout.html" %}

{% block title %}
    Buy Stock 
{% endblock %}

{% block main %}

<div>
    <form id="form-buy">
        <div class="mb-3">
            <input autocomplete="off" autofocus class="form-control mx-auto w-auto" name="symbol" placeholder="Symbol"
                type="text">
        </div>
        <div> 
            <input autocomplete="off" class="form-control mx-auto w-auto" name="shares" placeholder="Shares" type="number" min="1" value="1" step="1" required>
        </div>
        <button class="btn btn-primary" type="submit">Buy</button>
    </form>
    <p id="message" class="text-center mt-3"></p>
</div>

{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='buy.js') }}"></script>
{% endblock %}
